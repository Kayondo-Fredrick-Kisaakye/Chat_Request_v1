<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatRekwest | Freemium</title>
    <link rel="stylesheet" href="css_files/style.css">
</head>

<body>
    <section class="section-a">
        <form class="forms-1" id="freemium-request-form">

            <section class="sample">
                <p>Request a chat with <em>Sr. DYK</em> through</p>
                <h2><span class="span-1">Freemium</span> Request</h2>
            </section>

            <div class="form-group">
                <label for="name"><strong>Name:</strong></label>
                <input id="name" type="text" name="name" required placeholder="Belinda Kelin" style="font-size: small;">
            </div>

            <div class="form-group">
                <label for="phone_number"><strong>Phone Number:</strong></label>
                <input id="phone_number" type="tel" name="phone_number" required placeholder="0750251430"
                    style="font-size: small;">
            </div>

            <div class="form-group">
                <label for="email"><strong>Email:</strong></label>
                <input id="email" type="email" name="email" required placeholder="belindakelin@fake.mail"
                    style="font-size: small;">
            </div>

            <div class="form-group">
                <label for="request_notes"><strong>Request Notes:</strong></label>
                <input id="request_notes" type="text" name="request" required placeholder="Think of a Request Note!"
                    style="font-size: small;">
            </div><br>

            <button type="submit" name="send_request" class="btn btn-primary" style="font-size: small;">Send
                Request</button>

            <p style="font-size: small;">Feel special? Try my <a href="premiumrequest.html" class="anchor-1">Premium</a>
            </p>
        </form>
    </section>

    <footer class="footer" style="font-size: small;">
        <h6>KAYONDO FREDRICK KISAAKYE|PixelCode</h6>
    </footer>
    <script src="js/freemium.js" defer></script>
</body>

</html>

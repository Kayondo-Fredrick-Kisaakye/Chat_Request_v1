<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatRekwest | Premium</title>
    <link rel="stylesheet" href="css_files/premium.css">
</head>

<body>
    <section class="section-a">
        <form class="forms-1">

            <section class="sample">
                <h2><sup>
                        <h6> Request a chat with <em>Sr. DYK</em> through</h6>
                    </sup><span class="span-1">Premium</span> Request</h2>
            </section>

            <div class="form-group">
                <label for="name"><strong>Name:</strong></label>
                <input type="text" name="name" required placeholder="Belinda Kelin" style="font-size: small;">
            </div>

            <div class="form-group">
                <label for="phone_number"><strong>Phone Number:</strong></label>
                <input type="tel" name="phone_number" required placeholder="0750251430" style="font-size: small;">
            </div>

            <div class="form-group">
                <label for="email"><strong>Email:</strong></label>
                <input type="email" name="email" required placeholder="belindakelin@fake.mail"
                    style="font-size: small;">
            </div>

            <div class="form-group">
                <label for="request_notes"><strong>Request Notes:</strong></label>
                <input type="text" name="request" required placeholder="Think of a Request Note!"
                    style="font-size: small;">
            </div><br>

            <button type="submit" name="continue_to_payment" class="btn btn-primary" style="font-size: small;">Continue
                to Payment</button>

            <p style="font-size: small;">Can't use Premium? Go back to <a href="index.html"
                    class="anchor-1">Freemium</a></p>
        </form>
    </section>

    <footer class="footer" style="font-size: small;">
        <h6>KAYONDO FREDRICK KISAAKYE|PixelCode</h6>
    </footer>
</body>

</html>

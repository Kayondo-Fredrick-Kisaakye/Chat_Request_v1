<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatRekwest Finish Payment</title>
    <link rel="stylesheet" href="css_files/finishpayment.css">
</head>

<body>
    <section class="section-a">
        <header class="payment-header">
            <p class="payment-kicker">SECURE CHECKOUT</p>
            <h1>Complete your payment</h1>
            <p>Premium chat request</p>
        </header>

        <form id="payment-form">

            <div class="form-group">
                <label for="cc-name" style="font-size: small;"><strong>Name on Card</strong></label>
                <input type="text" id="cc-name" autocomplete="cc-name" required style="font-size: small;" />
            </div>

            <div class="form-group">
                <label for="cc-number" style="font-size: small;"><strong>Card Number</strong></label>
                <input type="text" id="cc-number" inputmode="numeric" autocomplete="cc-number" pattern="[0-9]+"
                    minlength="15" maxlength="19" required style="font-size: small;" />
            </div>

            <div class="payment-details">
                <div class="form-group">
                    <label for="cc-exp" style="font-size: small;"><strong>Expiry Date</strong></label>
                    <input type="text" id="cc-exp" autocomplete="cc-exp" placeholder="MM/YY" required
                        style="font-size: small;" />
                </div>

                <div class="form-group">
                    <label for="cc-csc" style="font-size: small;"><strong>Security Code (CVC)</strong></label>
                    <input type="text" id="cc-csc" inputmode="numeric" autocomplete="cc-csc" minlength="3" maxlength="4"
                        required style="font-size: small;" />
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="font-size: small;">Pay Now</button>
        </form>
    </section>

    <p id="payment-message" role="status" aria-live="polite"></p>

    <footer class="footer">
        <h6>KAYONDO FREDRICK KISAAKYE|PixelCode</h6>
    </footer>
    <script src="js/premium.js" defer></script>
</body>

</html>

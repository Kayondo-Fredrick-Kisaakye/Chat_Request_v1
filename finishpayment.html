<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatRekwest Finish Payment</title>
    <link rel="stylesheet" href="css_files/finishpayment.css">
</head>

<body>
    <section class="section-a">

        <form id="payment-form">

            <div class="form-group">
                <label for="cc-name" style="font-size: small;">Name on Card</label>
                <input type="text" id="cc-name" autocomplete="cc-name" required style="font-size: small;" />
            </div>

            <div class="form-grouup">
                <label for="cc-number" style="font-size: small;">Card Number</label>
                <input type="text" id="cc-number" inputmode="numeric" autocomplete="cc-number" pattern="[0-9]+"
                    minlength="15" maxlength="19" required style="font-size: small;" />
            </div>

            <div class="form-group">
                <label for="cc-exp" style="font-size: small;">Expiry Date</label>
                <input type="text" id="cc-exp" autocomplete="cc-exp" placeholder="MM/YY" required
                    style="font-size: small;" />
            </div>

            <div class="form-group">
                <label for="cc-csc" style="font-size: small;">Security Code (CVC)</label>
                <input type="text" id="cc-csc" inputmode="numeric" autocomplete="cc-csc" minlength="3" maxlength="4"
                    required style="font-size: small;" />
            </div>

            <button type="submit" class="btn btn-primary" style="font-size: small;">Pay Now</button>
        </form>
    </section>

    <footer>
        <h6>KAYONDO FREDRICK KISAAKYE|PixelCode</h6>
    </footer>
</body>

</html>
